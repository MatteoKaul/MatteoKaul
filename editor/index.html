<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Only files from this site; images may be data: URLs (the rendered SVGs). -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Profile Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header class="bar">
  <strong class="brand">PROFILE EDITOR</strong>
  <label>Data
    <select id="dataSource">
      <option value="github">GitHub data</option>
      <option value="sample">Sample data</option>
    </select>
  </label>
  <label>Preview
    <select id="previewMode">
      <option value="dark">GitHub dark</option>
      <option value="light">GitHub light</option>
    </select>
  </label>
  <span class="spacer"></span>
  <label class="button">Import settings.txt<input type="file" id="importFile" accept=".txt" hidden></label>
  <button id="copy">Copy settings.txt</button>
  <button id="download" class="primary">Download settings.txt</button>
  <a id="editOnGithub" class="button" target="_blank" rel="noopener">Edit on GitHub</a>
</header>

<main>
  <nav class="panel" id="modules" aria-label="Modules"></nav>
  <section class="panel" id="options" aria-label="Options"></section>
  <section class="preview" id="preview" aria-label="Preview">
    <div class="status" id="status"></div>
    <!-- sandbox without allow-scripts: nothing in the preview can run code.
         allow-same-origin only lets the editor keep the scroll position. -->
    <iframe id="frame" title="README preview" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
  </section>
</main>

<script type="module" src="editor.js"></script>
</body>
</html>
