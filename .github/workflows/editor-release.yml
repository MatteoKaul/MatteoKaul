# Module 5: Automated Semantic Versioning & Multi-OS Release Builder for the Editor.
#
# - Triggers ONLY on changes inside `editor/**`.
# - Fork Guard: Skips execution completely on forks (`if: github.repository == 'MatteoKaul/MatteoKaul' || github.repository == 'MatteoKaul/Homespace'`).
# - Determines the next Semantic Version (Major / Minor / Patch) from Conventional Commits.
# - Compiles and publishes standalone binaries for:
#     * macOS (ARM64 / Apple Silicon)
#     * Windows (x64)
#     * Linux (x64 & ARM64)
name: Release Editor

on:
  push:
    branches: [main]
    paths:
      - "editor/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-editor
  cancel-in-progress: false

jobs:
  version:
    name: Semantic Versioning
    # Disable workflow on forks of other users
    if: github.repository == 'MatteoKaul/MatteoKaul' || github.repository == 'MatteoKaul/Homespace'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semver.outputs.tag }}
      version: ${{ steps.semver.outputs.version }}
      changelog: ${{ steps.semver.outputs.changelog }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Calculate next Semantic Version from Conventional Commits
        id: semver
        run: |
          LAST_TAG=$(git tag --list 'editor-v*' --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            MAJOR=1; MINOR=0; PATCH=0
            RANGE="HEAD"
          else
            VER="${LAST_TAG#editor-v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
            RANGE="${LAST_TAG}..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:"%s%n%b" -- editor/ || true)
          if [ -z "$LAST_TAG" ]; then
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          elif echo "$COMMITS" | grep -Eq "(BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:)"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          elif echo "$COMMITS" | grep -Eq "^feat(\([^)]+\))?:"; then
            MINOR=$((MINOR + 1)); PATCH=0
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          else
            PATCH=$((PATCH + 1))
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG="editor-v${NEXT}"
          NOTES=$(git log "$RANGE" --pretty=format:"- %s (%h)" -- editor/ | head -n 40)
          [ -z "$NOTES" ] && NOTES="- Automated editor release ${TAG}"

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "$TAG" --force

  build:
    name: Build (${{ matrix.label }})
    needs: version
    if: github.repository == 'MatteoKaul/MatteoKaul' || github.repository == 'MatteoKaul/Homespace'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-14
            target: node18-macos-arm64
            artifact: homespace-editor-macos-arm64
          - label: windows-x64
            os: windows-latest
            target: node18-win-x64
            artifact: homespace-editor-windows-x64.exe
          - label: linux-x64
            os: ubuntu-latest
            target: node18-linux-x64
            artifact: homespace-editor-linux-x64
          - label: linux-arm64
            os: ubuntu-latest
            target: node18-linux-arm64
            artifact: homespace-editor-linux-arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Bundle and compile standalone binary
        shell: bash
        run: |
          mkdir -p dist/bundle
          npx --yes esbuild editor/desktop/app.mjs --bundle --platform=node --format=cjs --outfile=dist/app.cjs
          npx --yes @yao-pkg/pkg dist/app.cjs --targets "${{ matrix.target }}" --output "dist/bundle/${{ matrix.artifact }}"
          cp -r editor scripts fonts default.config.json default.settings.txt dist/bundle/
          cd dist/bundle
          if [[ "${{ matrix.label }}" == "windows-x64" ]]; then
            7z a "../${{ matrix.label }}.zip" .
          else
            tar -czf "../${{ matrix.label }}.tar.gz" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: ${{ matrix.label }}
          path: |
            dist/${{ matrix.label }}.tar.gz
            dist/${{ matrix.label }}.zip

  release:
    name: Publish GitHub Release
    needs: [version, build]
    if: github.repository == 'MatteoKaul/MatteoKaul' || github.repository == 'MatteoKaul/Homespace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" release-assets/* \
            --title "Profile Editor v${{ needs.version.outputs.version }}" \
            --notes "${{ needs.version.outputs.changelog }}"
