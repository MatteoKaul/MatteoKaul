# Regenerates assets/stats.svg with scripts/stats.py and commits it if it changed.
# Runs daily, on manual start (Actions tab -> "Run workflow") and when the
# stats code changes on main. Needs "Read and write permissions" for workflows
# (Settings -> Actions -> General) so the job can push the new image.
name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/stats.py, scripts/dotmatrix.py]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The built-in token is enough: it only reads public profile data.
      - name: Generate stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/stats.py

      # Commits made with GITHUB_TOKEN do not trigger workflows, so no loop.
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "Update profile stats" && git push)
