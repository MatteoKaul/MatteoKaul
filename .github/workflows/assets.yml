# Rebuilds banner, headings and icon tiles with scripts/build_assets.py when
# settings.txt or the build code changes on main, then commits the images.
# So changing banner_title in settings.txt (even in the GitHub web editor)
# is enough to update the banner. Also startable from the Actions tab.
name: Build assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - settings.txt
      - scripts/build_assets.py
      - scripts/dotmatrix.py
      - scripts/icons.json
      - assets/src/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build assets
        run: |
          pip install pillow
          python scripts/build_assets.py

      # Commits made with GITHUB_TOKEN do not trigger workflows, so no loop.
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Rebuild assets" && git push)
